apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-api
  namespace: app-platform
  labels:
    app: frontend-api
    tier: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend-api
  template:
    metadata:
      labels:
        app: frontend-api
        tier: web
    spec:
      containers:
        - name: frontend
          image: ghcr.io/datadevops/dr-frontend-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: frontend-api
            - name: SERVICE_MODE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SERVICE_MODE
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_URL
            - name: PG_POOL_MIN
              value: "1"
            - name: PG_POOL_MAX
              value: "10"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-api
  namespace: app-platform
  labels:
    app: frontend-api
spec:
  selector:
    app: frontend-api
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
