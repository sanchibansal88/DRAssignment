apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: app-platform
  annotations:
    kubernetes.io/service-account.name: app-platform
    dr.sre.io/managed-by: vault
stringData:
  DATABASE_HOST: ${PRIMARY_POSTGRES_FQDN}
  DATABASE_READ_REPLICA_HOST: ${DR_POSTGRES_FQDN}
  DATABASE_USER: pgapp
  DATABASE_PASSWORD: "${DATABASE_PASSWORD_FROM_SECRET_MANAGER}"
  DATABASE_URL: "postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:5432/appdb"
# This manifest is a template and should be converted to a Secret using your
# preferred mechanism (Azure Key Vault CSI, SealedSecrets, or External Secrets).
