apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservices.fullname" . }}-logic
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "microservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: business-logic
spec:
  replicas: {{ .Values.businessLogic.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: business-logic
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: business-logic
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: business-logic
          image: "{{ .Values.businessLogic.image.repository }}:{{ .Values.businessLogic.image.tag }}"
          imagePullPolicy: {{ .Values.businessLogic.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: business-logic-service
            - name: DATA_INGEST_URL
              value: http://{{ include "microservices.fullname" . }}-ingest.{{ .Values.namespace }}.svc.cluster.local:8080/ingest
            - name: DATA_INGEST_TIMEOUT
              value: "5"
            {{- with .Values.businessLogic.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.businessLogic.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "microservices.fullname" . }}-logic
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "microservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: business-logic
spec:
  type: {{ .Values.businessLogic.service.type }}
  selector:
    app.kubernetes.io/component: business-logic
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.businessLogic.service.port }}
      targetPort: http
      name: http
      protocol: TCP
