apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservices.fullname" . }}-ingest
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "microservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-ingest
spec:
  replicas: {{ .Values.dataIngest.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: data-ingest
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: data-ingest
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: data-ingest
          image: "{{ .Values.dataIngest.image.repository }}:{{ .Values.dataIngest.image.tag }}"
          imagePullPolicy: {{ .Values.dataIngest.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.urlKey }}
            - name: PG_POOL_MIN
              value: "1"
            - name: PG_POOL_MAX
              value: "10"
            {{- with .Values.dataIngest.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dataIngest.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "microservices.fullname" . }}-ingest
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "microservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-ingest
spec:
  type: {{ .Values.dataIngest.service.type }}
  selector:
    app.kubernetes.io/component: data-ingest
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.dataIngest.service.port }}
      targetPort: http
      name: http
      protocol: TCP
